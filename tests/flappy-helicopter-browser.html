<!doctype html><html><head><meta charset="utf-8"><title>Flappy helicopter checks</title><style>body{background:#102532;color:#fff;font:16px system-ui;padding:24px}.result{background:#173747;border-radius:8px;margin:7px 0;padding:8px 12px}.pass{border-left:5px solid #69e5a2}.fail{border-left:5px solid #ff7f77}iframe{height:900px;left:0;opacity:.01;pointer-events:none;position:fixed;top:0;width:1200px}</style></head><body><h1>Flappy Render helicopter checks</h1><p id="summary">Running…</p><div id="results"></div><script>
localStorage.setItem('tamzidFlappyBest','11');localStorage.setItem('tamzidFlappySkin','plane911');const frame=document.createElement('iframe');frame.src='../game.html?v=flappy-helicopter';document.body.append(frame);const checks=[],check=(ok,label)=>checks.push({ok:!!ok,label});frame.addEventListener('load',()=>{setTimeout(()=>{const doc=frame.contentDocument,button=doc.querySelector('[data-skin="helicopter"]');check(Boolean(button),'Helicopter replaces the 911 selection');check(button?.querySelector('.skin-name')?.textContent==='Helicopter','Selection name is exactly Helicopter');check(!doc.querySelector('[data-skin="plane911"]'),'Old 911 option is absent');check(getComputedStyle(button.querySelector('.skin-preview-helicopter')).backgroundImage.includes('helicopter.svg'),'Selection uses the local helicopter icon');check(frame.contentWindow.localStorage.getItem('tamzidFlappySkin')==='helicopter','Existing 911 preferences migrate to Helicopter');button.click();check(frame.contentWindow.localStorage.getItem('tamzidFlappySkin')==='helicopter'&&button.classList.contains('is-active'),'Helicopter remains selectable with existing skin logic');const canvas=doc.querySelector('#flappyCanvas'),pixels=canvas.getContext('2d').getImageData(65,210,60,60).data;check(pixels.some((value,index)=>index%4!==3&&value<220),'Selected helicopter renders into the game canvas');const passed=checks.filter(item=>item.ok).length;document.querySelector('#summary').textContent=`${passed}/${checks.length} checks passed`;document.querySelector('#results').innerHTML=checks.map(item=>`<div class="result ${item.ok?'pass':'fail'}">${item.ok?'PASS':'FAIL'} — ${item.label}</div>`).join('');document.body.dataset.complete='true'},800)});
</script></body></html>
